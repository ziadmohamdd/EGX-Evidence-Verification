[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "egx-guide"
version = "0.1.0"
description = "Research prototype: evidence verification in single- and multi-agent investment recommendations on Egyptian disclosures"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "tradingagents",
    "pypdfium2>=4.30",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
